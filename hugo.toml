baseURL = "http://localhost:1313/"
title = "Versori Documentation"

enableGitInfo = false
disablePathToLower = true

[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

  # Once any custom mount is declared, Hugo drops its implicit defaults, so every
  # directory the site actually uses has to be listed explicitly below.
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "static"
    target = "static"

  # openapi/, images/ and logo/ stay in place at the repo root (single source of
  # truth - see CONTRIBUTING.md) and are exposed to Hugo via mounts instead of copies.
  [[module.mounts]]
    source = "openapi"
    target = "assets/openapi"
  [[module.mounts]]
    source = "images"
    target = "static/images"
  [[module.mounts]]
    source = "logo"
    target = "static/logo"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.alerts]
        enable = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3

[params]
  BookTheme = "auto"
  BookSection = "*"
  BookLogo = "logo/versori-logo.svg"
  BookFavicon = "logo/versori-logo.svg"
  BookSearch = true
  BookComments = false
  # Site-specific tab bar / scoped-sidebar overrides (see layouts/_partials/docs/)
  # read their own navigation structure from data/tabs.yaml, BookSection above is
  # just a harmless fallback for anything that doesn't go through our override.
